name: solo63-leafledger
services:
  bench:
    build:
      context: .
      args:
        LEAFLEDGER_DEPS_IMAGE: ${LEAFLEDGER_DEPS_IMAGE:-python:3.11-slim}
    image: ${LEAFLEDGER_IMAGE:-solo63-leafledger:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${LEAFLEDGER_PORT:-19965}:8000"
    volumes:
      - surface-library:/var/lib/leafledger
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  surface-library:
